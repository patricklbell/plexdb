[pytest]
addopts = --no-header
markers =
    nightly: upstream marker for tests that only run in nightly CI (informational, not filtered here)
    skip_bug: upstream marker for tests ScyllaDB itself skips as flaky/buggy against its own implementation (informational, not filtered here — this engine may not share the same bug)
    skip_not_implemented: upstream marker for tests that reference helpers ScyllaDB never finished porting; conftest.py converts these to real skips
    skip_env: upstream marker for tests needing something the test harness doesn't run (e.g. a vector store service); conftest.py converts these to real skips
